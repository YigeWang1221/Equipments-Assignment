version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: equip-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: equip_management
      MYSQL_USER: equip
      MYSQL_PASSWORD: equip123456
    ports:
      - "3306:3306"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - equip-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: equip-redis
    ports:
      - "6379:6379"
    volumes:
      - equip-redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: equip-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - equip-minio-data:/data

volumes:
  equip-mysql-data:
  equip-redis-data:
  equip-minio-data:
