spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/equip_management?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
  data:
    redis:
      repositories:
        enabled: false

app:
  auth:
    store: memory
  storage:
    type: local

logging:
  level:
    com.zjgs.equip: debug

management:
  health:
    redis:
      enabled: false
